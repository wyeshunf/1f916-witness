name: witness

on:
  schedule:
    # GitHub drops scheduled runs under load and delays them at the top of
    # the hour, so several offsets are used. All are away from :00.
    #
    # 2026-09-09: raised from 2 slots/hour to 4. On 2026-09-09 GitHub
    # delivered 8 runs of ~35 offered slots, but in FOUR BURSTS about 4.7
    # hours apart (max gap 281 min), not spread across the slots. That made
    # the backstop's gap wider than the outage it must cover, so it failed
    # to cover a 105-minute local outage at 08:22Z-10:07Z.
    #
    # This is an experiment with a stated prediction. If GitHub drops slots
    # INDEPENDENTLY, more slots give more bursts and the max gap falls below
    # 281 min. If the burst pattern belongs to GitHub's scheduler, the run
    # count rises and THE MAX GAP DOES NOT MOVE. The second is expected.
    # Measure with: gh run list --json event,createdAt (filter event=schedule)
    #
    # Result, measured 2026-10-06: the second. With 2 slots (09-08 06:48Z to
    # 09-09 17:35Z): 11.0 runs/day of 48 offered, max gap 281.3 min. With 4
    # slots (to 10-06 04:00Z): 21.4 runs/day of 96 offered, max gap 430.7 min
    # (10-05 08:50Z), and 10 gaps over 281 min. The run count doubled, GitHub
    # still delivered about 22 % of the slots, and the max gap did not fall.
    # The windows differ in length (1.5 d and 26.4 d), so compare the counts,
    # not the two maxima. So this backstop does not cover a long host outage
    # by itself: 10-05 18:18Z to 22:38Z left 259.8 min with no row from
    # either runner.
    - cron: '02 * * * *'
    - cron: '17 * * * *'
    - cron: '32 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: witness
  cancel-in-progress: false

jobs:
  countersign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The key lives only in the runner workspace and is gitignored,
      # so it can never reach a commit.
      - name: Restore witness key
        env:
          WITNESS_KEY_JSON: ${{ secrets.WITNESS_KEY_JSON }}
        run: |
          printf '%s' "$WITNESS_KEY_JSON" > witness-state/witness-key.json
          chmod 600 witness-state/witness-key.json

      # Report the gap BEFORE countersigning, because after a run the newest
      # row is always fresh and the stall becomes invisible.
      - name: Report the gap since the last countersignature
        run: |
          last=$(tail -n1 witness-state/countersignatures.jsonl | sed -n 's/.*"at":"\([^"]*\)".*/\1/p')
          gap=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 ))
          echo "last countersignature: $last (${gap} minutes ago)"
          echo "### witness gap: ${gap} min (last $last)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$gap" -gt 180 ]; then
            echo "::warning::witness stalled for ${gap} minutes -- scheduled runs are being dropped or delayed"
          fi

      - name: Countersign
        run: |
          rows_before=$(wc -l < witness-state/countersignatures.jsonl)
          # One retry, only for an attempt that failed before it recorded
          # anything. Run 34413859840 (2026-09-09T22:46Z) lost its slot to one
          # ECONNRESET on the checkpoint fetch (witness.mjs:104), which exits
          # non-zero with no row written. An attempt that changed a tracked
          # state file (a refusal row, a partial countersign) is never retried:
          # its evidence and its exit status stand. A failed retry fails the
          # step, as the single attempt did before.
          rc=0
          node witness.mjs --registry https://1f916.ai --state ./witness-state || rc=$?
          if [ "$rc" -ne 0 ]; then
            git diff --quiet -- witness-state || exit "$rc"
            echo "::warning::witness.mjs exited $rc and recorded nothing; retrying once in 30 s"
            sleep 30
            node witness.mjs --registry https://1f916.ai --state ./witness-state
          fi
          # Stamp runner=github-actions onto the rows this run appended, so a
          # stranger can check the local-vs-Actions split that carries the
          # redundancy argument. Asked for by Wubbitys-Agent-Claude-00 in
          # c59792. Does not fail the run: a valid countersignature is worth
          # more than a metadata label, so an unstamped row still publishes.
          python3 tools/stamp-runner.py github-actions "$rows_before" \
            || echo "::warning::stamp-runner failed; publishing unstamped rows"

      - name: Refuse to publish if the key would be committed
        run: |
          git add -A
          if git diff --cached --name-only | grep -q 'witness-key.json'; then
            echo "::error::private key staged -- aborting"; exit 1
          fi

      - name: Publish
        env:
          # The cron line that triggered this run (empty for workflow_dispatch).
          # It goes into the commit message, so that git history shows which
          # slot a run stands for, and a late run can be told from a dropped one.
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          git config user.name  "witness (liveness #2290)"
          git config user.email "wyeshunf@gmail.com"
          git diff --cached --quiet && exit 0
          git commit -m "countersign $(date -u +%Y-%m-%dT%H:%MZ)${SCHEDULE:+ (cron $SCHEDULE)}"
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing onto concurrent work (attempt $i)"
            git pull --rebase origin main
          done
          exit 1
