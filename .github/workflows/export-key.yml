name: export-key

# Run by hand only, once, to restore the local runner after the drive failure
# of 2026-10-12. That failure deleted every local copy of the witness key, so
# the WITNESS_KEY_JSON secret is the only copy left.
#
# The key leaves the runner only encrypted to the recipient given as input:
# a fresh AES-256-GCM key encrypts the secret, and RSA-OAEP-256 wraps that key
# for an RSA-4096 public key whose private half never leaves the operator's
# machine. Nothing secret goes to the log. The artifact lives 1 day and is
# deleted after the download, and this file is removed after the one run.
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: 'base64 SPKI DER of an RSA-4096 public key'
        required: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the witness key to the recipient
        env:
          WITNESS_KEY_JSON: ${{ secrets.WITNESS_KEY_JSON }}
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          node --input-type=module > witness-key.enc.json <<'EOF'
          import { createPrivateKey, createPublicKey, createCipheriv, publicEncrypt, randomBytes, constants } from "node:crypto";
          const raw = process.env.WITNESS_KEY_JSON;
          const keys = JSON.parse(raw);
          const priv = createPrivateKey({ key: Buffer.from(keys.private_key_pkcs8_b64, "base64"), format: "der", type: "pkcs8" });
          const x = createPublicKey(priv).export({ format: "jwk" }).x;
          if (x !== "NgHCVDwGuYeHX0qnuOKBgufNwgu804x1ZDyTU63sJwE") { console.error(`not the witness #8 key: ${x}`); process.exit(1); }
          const rcpt = createPublicKey({ key: Buffer.from(process.env.RECIPIENT, "base64"), format: "der", type: "spki" });
          if (rcpt.asymmetricKeyType !== "rsa" || rcpt.asymmetricKeyDetails.modulusLength < 4096) { console.error("recipient must be RSA-4096"); process.exit(1); }
          const k = randomBytes(32), iv = randomBytes(12);
          const c = createCipheriv("aes-256-gcm", k, iv);
          const ct = Buffer.concat([c.update(raw, "utf8"), c.final()]);
          const wrapped = publicEncrypt({ key: rcpt, padding: constants.RSA_PKCS1_OAEP_PADDING, oaepHash: "sha256" }, k);
          console.log(JSON.stringify({ alg: "RSA-OAEP-256+A256GCM", witness_public_key: x, wrapped_key: wrapped.toString("base64"),
            iv: iv.toString("base64"), tag: c.getAuthTag().toString("base64"), ciphertext: ct.toString("base64") }));
          console.error(`encrypted the key of witness #8 (${x}) to the recipient`);
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: witness-key-enc
          path: witness-key.enc.json
          retention-days: 1
